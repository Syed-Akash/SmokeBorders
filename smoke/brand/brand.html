<!doctype html>
<html><head><meta charset="utf-8">
<!-- Smoke & Borders channel art. ?k=banner (2560x1440) or ?k=avatar (800x800). Served from the repo root. -->
<style>
@font-face{font-family:PF;src:url(../../studio/fonts/playfair-display-latin-900-normal.woff2)}
@font-face{font-family:PFI;src:url(../../studio/fonts/playfair-display-latin-400-italic.woff2)}
@font-face{font-family:BAR;src:url(../../studio/fonts/barlow-600.woff2)}
html,body{margin:0;background:#14120f}canvas{display:block}
</style>
<script src="../../studio/doc/vendor/d3-array.min.js"></script>
<script src="../../studio/doc/vendor/d3-geo.min.js"></script>
<script src="../../studio/doc/vendor/topojson-client.min.js"></script>
</head><body><canvas id="c"></canvas>
<script>
const K=new URLSearchParams(location.search).get('k')||'banner';
const W=K==='banner'?2560:800,H=K==='banner'?1440:800;
const c=document.getElementById('c');c.width=W;c.height=H;let x=c.getContext('2d');
const EMBER='#ff6a1f',BONE='#efe6d2',INK='#14120f';
let seed=7,LW=1;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
// rough hand-traced borders (lon, lat): India-Pakistan, France-Germany, the 38th parallel
const LINES=[[[68.2,23.7],[69.5,24.3],[70.8,25.2],[70.3,26.5],[70.0,27.8],[71.9,27.9],[73.4,29.9],[74.6,31.0],[74.6,31.9],[75.3,32.3],[74.8,33.1],[74.0,34.0],[74.6,35.0]],
  [[6.1,49.5],[7.0,49.2],[8.2,49.0],[7.6,48.0],[7.6,47.6]],[[124.6,38],[126,38],[127,38],[128.6,38]]];
function paper(){x.fillStyle=INK;x.fillRect(0,0,W,H);const g=x.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'rgba(30,27,24,.3)');g.addColorStop(1,'rgba(0,0,0,.65)');x.fillStyle=g;x.fillRect(0,0,W,H);
  const im=x.getImageData(0,0,W,H),d=im.data;for(let i=0;i<d.length;i+=4){const n=(rnd()-.5)*14;d[i]+=n;d[i+1]+=n;d[i+2]+=n}x.putImageData(im,0,0)}
function smoke(pts,amount,height){const L=document.createElement('canvas');L.width=W;L.height=H;const o=x;x=L.getContext('2d');for(let n=0;n<amount;n++){const s=pts[(rnd()*pts.length)|0],up=rnd()**1.6*height,r=8+up*.35+rnd()*18;
  const g=x.createRadialGradient(s[0]+(rnd()-.5)*up*.5,s[1]-up,0,s[0]+(rnd()-.5)*up*.5,s[1]-up,r);const a=.05*(1-up/height)+.012;
  g.addColorStop(0,`rgba(${150+rnd()*40|0},${135+rnd()*30|0},${120},${a})`);g.addColorStop(1,'rgba(120,110,100,0)');x.fillStyle=g;x.fillRect(s[0]-up-r*2,s[1]-up-r*2,up*2+r*4,r*4+up*2)}x=o;x.save();x.filter='blur(5px)';x.drawImage(L,0,0);x.restore()}
function emberLine(pts,w){x.lineJoin=x.lineCap='round';
  for(const [lw,col,blur] of [[w*5,'rgba(255,90,20,.18)',w*6],[w*2.2,'rgba(255,110,30,.55)',w*3],[w,EMBER,w],[w*.35,'#ffe2b8',0]]){x.save();x.shadowColor=EMBER;x.shadowBlur=blur;x.strokeStyle=col;x.lineWidth=lw;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke();x.restore()}
  // sparks
  for(let n=0;n<pts.length*1.5;n++){const p=pts[(rnd()*pts.length)|0];x.fillStyle=`rgba(255,${150+rnd()*80|0},60,${.4+rnd()*.6})`;x.beginPath();x.arc(p[0]+(rnd()-.5)*w*5,p[1]-rnd()**2*w*30,rnd()*w*.3+.5,0,7);x.fill()}}
function dense(p){const o=[];for(let i=0;i<p.length-1;i++)for(let t=0;t<1;t+=.1)o.push([p[i][0]+(p[i+1][0]-p[i][0])*t,p[i][1]+(p[i+1][1]-p[i][1])*t]);o.push(p[p.length-1]);return o}
async function map(proj){const l=await (await fetch('../../studio/doc/data/land-50m.json')).json(),land=topojson.feature(l,l.objects.land);
  const g=await (await fetch('../../studio/doc/data/world_1994.geojson')).json();const path=d3.geoPath(proj,x);
  x.fillStyle='rgba(78,67,52,.95)';for(const f of g.features){if(d3.geoArea(f)>6)continue;x.beginPath();path(f);x.fill()}   // skip polygons wound the wrong way (they cover the globe)
  x.beginPath();path(g);x.strokeStyle='rgba(239,230,210,.13)';x.lineWidth=(K==='banner'?1.4:1)/LW;x.stroke();
  x.beginPath();path(land);x.strokeStyle='rgba(239,230,210,.28)';x.lineWidth=(K==='banner'?1.8:1.2)/LW;x.stroke();
  // graticule, like an old atlas
  x.beginPath();path(d3.geoGraticule10());x.strokeStyle='rgba(239,230,210,.05)';x.lineWidth=1/LW;x.stroke()}
function txt(s,X,Y,font,fill,al='center'){x.font=font;x.textAlign=al;x.textBaseline='alphabetic';x.fillStyle=fill;x.fillText(s,X,Y)}
async function banner(){paper();const proj=d3.geoMercator().scale(1000).translate([0,0]);
  const A=proj([7.4,48.6]),B=proj([71.8,29.5]),ang=Math.atan2(B[1]-A[1],B[0]-A[0]),k=1900/Math.hypot(B[0]-A[0],B[1]-A[1]),mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2;
  const M=new DOMMatrix().translate(W/2,H/2+20).rotate(-ang*180/Math.PI).scale(k).translate(-mx,-my);
  x.save();x.setTransform(M);LW=k;await map(proj);x.restore();LW=1;
  const L=LINES.slice(0,2).map(l=>dense(l.map(p=>{const q=M.transformPoint(new DOMPoint(...proj(p)));return[q.x,q.y]})));L.forEach(l=>smoke(l,1100,210));
  // dark scrim behind the title (the safe area is the middle 1546x423)
  const sg=x.createRadialGradient(W/2,H/2/.42,0,W/2,H/2/.42,820);sg.addColorStop(0,'rgba(14,12,10,.82)');sg.addColorStop(.6,'rgba(14,12,10,.55)');sg.addColorStop(1,'rgba(14,12,10,0)');x.save();x.scale(1,.42);x.fillStyle=sg;x.fillRect(0,0,W,H/.42);x.restore();
  L.forEach(l=>emberLine(l,4));
  x.save();x.shadowColor='rgba(0,0,0,.8)';x.shadowBlur=30;
  x.font='136px PF';const a='SMOKE ',b='&',cc=' BORDERS',wa=x.measureText(a).width,wb=x.measureText(b).width,wc=x.measureText(cc).width,x0=W/2-(wa+wb+wc)/2,y=H/2+30;
  txt(a,x0,y,'136px PF',BONE,'left');x.save();x.shadowColor=EMBER;x.shadowBlur=40;txt(b,x0+wa,y,'136px PF',EMBER,'left');x.restore();txt(cc,x0+wa+wb,y,'136px PF',BONE,'left');window.TW=wa+wb+wc;
  txt('Every border has two sides. We tell both.',W/2,y+80,'italic 46px PFI','rgba(239,230,210,.88)');x.restore();
  x.fillStyle=EMBER;x.fillRect(W/2-80,y+110,160,4);
  txt('NEW STORY EVERY SATURDAY',W/2,y+158,'30px BAR','rgba(239,230,210,.7)')}
async function avatar(){paper();const proj=d3.geoMercator().center([72,29]).scale(2600).translate([W/2,H/2]);await map(proj);
  x.fillStyle='rgba(14,12,10,.45)';x.fillRect(0,0,W,H);
  const line=dense([[150,560],[250,520],[330,560],[410,500],[490,540],[570,480],[650,520]]);smoke(line,700,330);emberLine(line,9);
  x.save();x.shadowColor='rgba(0,0,0,.85)';x.shadowBlur=24;x.font='300px PF';const a='S',b='&',cc='B',wa=x.measureText(a).width,wb=x.measureText(b).width,wc=x.measureText(cc).width,x0=W/2-(wa+wb+wc)/2,y=430;
  txt(a,x0,y,'300px PF',BONE,'left');x.save();x.shadowColor=EMBER;x.shadowBlur=36;txt(b,x0+wa,y,'300px PF',EMBER,'left');x.restore();txt(cc,x0+wa+wb,y,'300px PF',BONE,'left');x.restore()}
document.fonts.load('170px PF').then(()=>document.fonts.load('54px PFI')).then(()=>document.fonts.load('34px BAR')).then(()=>K==='banner'?banner():avatar()).then(()=>{window.done=true});
</script></body></html>
