// FlagBomb History documentary renderer. window.load(era) -> window.init(timeline) -> window.frame(t)
const W=1920,H=1080,c=document.getElementById('c'),ctx=c.getContext('2d');

  sb:{sea0:'#3e5560',sea1:'#1c272d',grat:'rgba(240,225,190,.07)',land:'#cdb689',era:'#dcc79a',edge:'rgba(70,48,22,.62)',coast:'rgba(40,28,14,.35)',cloud:'40,28,14',cloudA:.05}};

const ERAS={};
window.load=async eras=>{const l=await (await fetch('data/land-50m.json')).json();LAND=topojson.feature(l,l.objects.land);
  for(const era of [].concat(eras)){const g=await (await fetch('data/world_'+era+'.geojson')).json();g.byName={};for(const f of g.features){const n=f.properties.NAME;if(n)(g.byName[n]=g.byName[n]||[]).push(f)}ERAS[era]=g}ERA=ERAS[[].concat(eras)[0]];
  await document.fonts.ready;await Promise.all(['700 40px "Playfair Display"','900 100px "Playfair Display"','italic 400 40px "Playfair Display"','700 40px "Barlow Semi Condensed"','600 30px "Barlow Semi Condensed"','30px Bungee','40px Anton','40px "Noto Color Emoji"','400 30px "Courier Prime"','700 40px "Courier Prime"'].map(f=>document.fonts.load(f)));

// ---------- flags ----------
const hs=cols=>(x,X,Y,w,h)=>cols.forEach((k,i)=>{x.fillStyle=k;x.fillRect(X,Y+h*i/cols.length,w,h/cols.length+1)});
const vs=cols=>(x,X,Y,w,h)=>cols.forEach((k,i)=>{x.fillStyle=k;x.fillRect(X+w*i/cols.length,Y,w/cols.length+1,h)});
const FLAGS={SUN:hs(['#c8102e','#c8102e','#c8102e']),GEMP:hs(['#111','#fff','#d00']),RUSE:hs(['#fff','#0039a6','#d52b1e']),SRB:hs(['#c6363c','#0c4076','#fff']),FRA:vs(['#0055a4','#fff','#ef4135']),BEL:vs(['#111','#fdda24','#ef3340']),
  AUH:(x,X,Y,w,h)=>{hs(['#c8102e','#fff','#c8102e'])(x,X,Y,w/2,h);hs(['#c8102e','#fff','#3a7d3a'])(x,X+w/2,Y,w/2,h)},
  ITK:(x,X,Y,w,h)=>{vs(['#009246','#fff','#ce2b37'])(x,X,Y,w,h);const s=h*.24;x.fillStyle='#1f4fa8';x.fillRect(X+w/2-s*.55,Y+h/2-s*.65,s*1.1,s*1.3);x.fillStyle='#ce2b37';x.fillRect(X+w/2-s*.42,Y+h/2-s*.52,s*.84,s*1.04);x.fillStyle='#fff';x.fillRect(X+w/2-s*.1,Y+h/2-s*.45,s*.2,s*.9);x.fillRect(X+w/2-s*.36,Y+h/2-s*.1,s*.72,s*.2)},
  GBR:(x,X,Y,w,h)=>{x.fillStyle='#012169';x.fillRect(X,Y,w,h);x.save();x.beginPath();x.rect(X,Y,w,h);x.clip();x.strokeStyle='#fff';x.lineWidth=h*.2;x.beginPath();x.moveTo(X,Y);x.lineTo(X+w,Y+h);x.moveTo(X+w,Y);x.lineTo(X,Y+h);x.stroke();
    x.strokeStyle='#c8102e';x.lineWidth=h*.07;x.stroke();x.restore();x.fillStyle='#fff';x.fillRect(X+w*.42,Y,w*.16,h);x.fillRect(X,Y+h*.37,w,h*.26);x.fillStyle='#c8102e';x.fillRect(X+w*.45,Y,w*.1,h);x.fillRect(X,Y+h*.41,w,h*.18)},

    x.fillStyle='#fff';x.fillRect(X+w*.41,Y,w*.18,h);x.fillRect(X,Y+h*.36,w,h*.28);x.fillStyle='#c8102e';x.fillRect(X+w*.45,Y,w*.1,h);x.fillRect(X,Y+h*.41,w,h*.18)},
  US13:(x,X,Y,w,h)=>{for(let i=0;i<13;i++){x.fillStyle=i%2?'#fff':'#b22234';x.fillRect(X,Y+h*i/13,w,h/13+1)}x.fillStyle='#3c3b6e';x.fillRect(X,Y,w*.42,h*.54);x.fillStyle='#fff';for(let i=0;i<13;i++){const a=i/13*6.283;x.beginPath();x.arc(X+w*.21+Math.cos(a)*h*.17,Y+h*.27+Math.sin(a)*h*.17,h*.024,0,7);x.fill()}},
  FRK:(x,X,Y,w,h)=>{x.fillStyle='#fdfbf3';x.fillRect(X,Y,w,h);x.fillStyle='#c9a227';for(const [a,b] of [[.3,.3],[.7,.3],[.5,.7]]){x.beginPath();x.arc(X+w*a,Y+h*b,h*.09,0,7);x.fill();x.fillRect(X+w*a-h*.02,Y+h*b,h*.04,h*.16)}},
  HES:(x,X,Y,w,h)=>{for(let i=0;i<8;i++){x.fillStyle=i%2?'#fff':'#d21034';x.fillRect(X,Y+h*i/8,w,h/8+1)}x.fillStyle='#1d4f9c';x.fillRect(X+w*.36,Y+h*.18,w*.28,h*.64)},
  OTT:(x,X,Y,w,h)=>{x.fillStyle='#e30a17';x.fillRect(X,Y,w,h);x.fillStyle='#fff';x.beginPath();x.arc(X+w*.44,Y+h/2,h*.25,0,7);x.fill();x.fillStyle='#e30a17';x.beginPath();x.arc(X+w*.49,Y+h/2,h*.2,0,7);x.fill()},
  // ancient flags (Smoke & Borders, Rome vs Carthage): Roman vexillum red with a gold wreath; Carthage purple with the gold sign of Tanit
  ROMA:(x,X,Y,w,h)=>{x.fillStyle='#9e1b2a';x.fillRect(X,Y,w,h);x.strokeStyle='#e0b84a';x.lineWidth=h*.08;x.beginPath();x.arc(X+w/2,Y+h/2,h*.28,Math.PI*.65,Math.PI*2.35);x.stroke();x.fillStyle='#e0b84a';x.fillRect(X,Y+h*.86,w,h*.08)},
  CART:(x,X,Y,w,h)=>{x.fillStyle='#4b1f5e';x.fillRect(X,Y,w,h);x.fillStyle='#e0b84a';x.beginPath();x.moveTo(X+w/2,Y+h*.42);x.lineTo(X+w/2-h*.2,Y+h*.84);x.lineTo(X+w/2+h*.2,Y+h*.84);x.closePath();x.fill();x.fillRect(X+w/2-h*.26,Y+h*.4,h*.52,h*.07);x.beginPath();x.arc(X+w/2,Y+h*.27,h*.11,0,7);x.fill()},
  NUMI:(x,X,Y,w,h)=>{x.fillStyle='#2f5d34';x.fillRect(X,Y,w,h);x.fillStyle='#e0b84a';x.beginPath();x.arc(X+w/2,Y+h/2,h*.22,0,7);x.fill();x.fillStyle='#2f5d34';x.beginPath();x.arc(X+w/2,Y+h/2,h*.12,0,7);x.fill()},
  JPN1:(x,X,Y,w,h)=>{x.fillStyle='#fff';x.fillRect(X,Y,w,h);x.fillStyle='#bc002d';x.beginPath();x.arc(X+w/2,Y+h/2,h*.3,0,7);x.fill()},
  US48:(x,X,Y,w,h)=>{for(let i=0;i<13;i++){x.fillStyle=i%2?'#fff':'#b22234';x.fillRect(X,Y+h*i/13,w,h/13+1)}x.fillStyle='#3c3b6e';x.fillRect(X,Y,w*.45,h*.54);x.fillStyle='#fff';for(let i=0;i<6;i++)for(let j=0;j<8;j++){x.beginPath();x.arc(X+w*.03+j*w*.055,Y+h*.05+i*h*.085,h*.014,0,7);x.fill()}},

  DOT:(x,X,Y,w,h)=>{const g=x.createRadialGradient(X+w*.4,Y+h*.35,h*.05,X+w/2,Y+h/2,h*.7);g.addColorStop(0,'#e6f6ff');g.addColorStop(.5,'#7cc4f2');g.addColorStop(1,'#1d5a99');x.fillStyle=g;x.fillRect(X,Y,w,h)}};
function drawFlag(code,x,X,Y,w,h){if(FLAGS[code])return FLAGS[code](x,X,Y,w,h);if(window.GFLAGS&&GFLAGS[code])return GFLAGS[code](x,X,Y,w,h);if(/^[A-Z]{2}$/.test(code)){x.save();x.fillStyle='#777';x.fillRect(X,Y,w,h);x.font=`${Math.round(h*1.25)}px ${EMO}`;x.textAlign='center';x.textBaseline='middle';
  const e=[...code].map(ch=>String.fromCodePoint(0x1F1E6+ch.charCodeAt(0)-65)).join(''),m=x.measureText(e);x.translate(X+w/2,Y+h/2);x.scale(w/(m.width*.82),1.05);x.fillText(e,0,h*.06);x.restore();return}x.fillStyle='#8b93a6';x.fillRect(X,Y,w,h)}
const MAIN={GB1707:'#1d2f6b',US13:'#3c3b6e',FRK:'#c9a227',HES:'#d21034',JPN1:'#bc002d',US48:'#3c3b6e',RAJ:'#c8102e',WEIM:'#333',POL:'#dc143c',CZS:'#11457e',YUG:'#003893',GEMP:'#555',RUSE:'#2a4aa0',SRB:'#8a2a2e',FRA:'#2a4aa0',BEL:'#333',AUH:'#9c1a2b',ITK:'#1d6b3d',GBR:'#1d2f6b',OTT:'#a01018',DOT:'#2f6fae'};

// ---------- state ----------
function state(t){const st={fx:[],tele:[],cars:[],era:null,cam:{...T.start},balls:{},links:{},hl:{},labels:[],pins:{},arrows:[],bubbles:[],cards:[],date:null,dim:0,flash:0,shake:0,zoom:0,clock:null,snow:0,chapter:null,outro:null};
  for(const e of EV){if(e.t>t)break;const u=clamp((t-e.t)/(e.dur||.6));
    switch(e.k){
    case 'cam':{const f={...st.cam},k=io(u);st.cam={lon:lerp(f.lon,e.lon,k),lat:lerp(f.lat,e.lat,k),scale:Math.exp(lerp(Math.log(f.scale),Math.log(e.scale),k))};break}
    case 'show':{const b=T.balls[e.id];st.balls[e.id]={id:e.id,flag:b.flag,label:b.label,char:b.char,lon:b.at[0],lat:b.at[1],r:b.r||56,mood:'neutral',t0:e.t,a:1};break}
    case 'move':if(st.balls[e.id]){const b=st.balls[e.id],k=io(u);b.lon=lerp(b.lon,e.lon,k);b.lat=lerp(b.lat,e.lat,k)}break;
    case 'mood':if(st.balls[e.id])st.balls[e.id].mood=e.mood;break;
    case 'hide':if(st.balls[e.id])st.balls[e.id].a=1-u;break;
    case 'unlink':if(e.all){for(const k in st.links)if(st.links[k].war)delete st.links[k]}else{delete st.links[e.a+e.b];delete st.links[e.b+e.a]}break;
    case 'link':if(!e.war&&t>e.t+(e.hold||40)+1.2){delete st.links[e.a+e.b];break}st.links[e.a+e.b]={a:e.a,b:e.b,color:e.color,u:o3((t-e.t)/.8)*(e.war?1:1-clamp((t-e.t-(e.hold||40))/1.2)),war:e.war,t0:e.t};break;
    case 'hl':for(const n of e.names)st.hl[n]={color:e.color,u:o3((t-e.t)/.9),t0:e.t};break;
    case 'unhl':for(const n of e.names)if(st.hl[n])st.hl[n].fade=u;break;
    case 'label':st.labels.push({...e,u:o3((t-e.t)/.6)*(1-clamp((t-e.t-(e.hold||12))/1))});break;
    case 'pin':st.pins[e.name]={lon:e.lon,lat:e.lat,name:e.name,u:t-e.t,hold:e.hold};break;
    case 'arrow':st.arrows.push({...e,u:clamp((t-e.t)/(e.dur||1.6)),age:t-e.t});break;
    case 'troops':st.arrows.push({...e,troops:1,u:t-e.t});break;
    case 'say':if(t<e.t+e.dur)st.bubbles.push({...e,u:t-e.t});break;
    case 'card':if(t<e.t+(e.dur||4))st.cards.push({...e,u:t-e.t});break;
    case 'date':st.date={text:e.text,u:t-e.t};break;
    case 'dim':st.dim=Math.max(st.dim,e.v*Math.min(o3((t-e.t)/.6),1-clamp((t-(e.t+(e.dur||3)))/.8)));break;
    case 'fx':if(e.flash)st.flash=Math.max(st.flash,e.flash*(1-clamp((t-e.t)/.4)));if(e.shake)st.shake=Math.max(st.shake,e.shake*(1-clamp((t-e.t)/.6)));if(e.zoomhit)st.zoom=Math.max(st.zoom,Math.sin(clamp((t-e.t)/.5)*Math.PI)*.07);break;
    case 'clock':st.clock={hours:e.hours,u:t-e.t,dur:e.dur||4.5};break;
    case 'snow':st.snow=e.off?Math.max(0,Math.min(st.snow,1-(t-e.t)/1.5)):Math.min(1,(t-e.t)/1.5);break;
    case 'chapter':if(t<e.t+e.dur)st.chapter={...e,u:t-e.t};break;
    case 'outro':st.outro={...e,u:t-e.t};break;
    case 'sub':if(t<e.t+(e.dur||6.2))st.sub={...e,u:t-e.t};break;
    case 'era':st.era={to:e.era,from:st.era?st.era.to:T.era,u:clamp((t-e.t)/1.6)};break;
    case 'explode':case 'fire':case 'smoke':case 'guns':case 'gas':if(t<e.t+(e.dur||6))st.fx.push({...e,u:t-e.t});break;
    case 'telegraph':if(t<e.t+(e.dur||3))st.tele.push({...e,u:t-e.t});break;
    case 'car':if(t<e.t+(e.dur||4)+1)st.cars.push({...e,u:t-e.t});break;
    // cinematic shots (scenes.js): a shot holds until the next shot or {shot:'off'}, which returns to the map
    case 'pop':if(t-e.t<e.dur)(st.pops=st.pops||[]).push({...e,u:t-e.t});break;
    case 'scene':st.prev=st.scene;st.scene=e.shot==='off'?null:{...e,u:t-e.t};st.sceneN=(st.sceneN||0)+1;break;
    case 'scenecue':if(st.scene)st.scene[e.key]=e.t-st.scene.t;break}}
  return st}

// ---------- drawing ----------
let GRAIN=null;const BASE={c:document.createElement('canvas'),key:null};BASE.c.width=W;BASE.c.height=H;BASE.ctx=BASE.c.getContext('2d');
function mkGrain(){const g=document.createElement('canvas');g.width=g.height=256;const x=g.getContext('2d'),d=x.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=10}x.putImageData(d,0,0);return g}
// Smoke & Borders: a side is an illustrated character (smoke/brand/chars.js) with a small flag, never a countryball
function person(b,x,y,r,t){const age=t-b.t0,pop=back(clamp(age/.4));if(pop<=0||b.a<=0)return;ctx.save();ctx.globalAlpha=b.a;ctx.translate(x,y);ctx.scale(pop,pop);
  const spec=Object.assign({},(window.CHAR_PRESETS||{})[b.char.preset]||{},b.char,{mood:b.mood==='neutral'?(b.char.mood||'neutral'):b.mood});const H=r*2.7;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,r*1.12,r*1.05,r*.18,0,0,7);ctx.fill();
  ctx.save();ctx.beginPath();ctx.ellipse(0,-r*.2,r*1.35,r*1.6,0,0,7);ctx.rect(-r*1.4,-r*.2,r*2.8,r*1.33);ctx.clip();drawChar(ctx,0,r*1.12,H,spec,t);ctx.restore();
  if(b.flag){const fx=-(spec.facing||1)*r*1.15,fy=-r*1.05,fw=r*.8,fh=r*.52,wave=Math.sin(t*3+b.lon)*.06;ctx.strokeStyle='#2b1d12';ctx.lineWidth=r*.06;ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(fx,r*.6);ctx.stroke();
    ctx.save();ctx.translate(fx,fy);ctx.transform(1,wave,0,1,0,0);ctx.beginPath();ctx.rect(0,0,fw,fh);ctx.clip();drawFlag(b.flag,ctx,0,0,fw,fh);ctx.restore();ctx.strokeStyle='#1b120c';ctx.lineWidth=r*.035;ctx.save();ctx.translate(fx,fy);ctx.transform(1,wave,0,1,0,0);ctx.strokeRect(0,0,fw,fh);ctx.restore()}
  if(b.label){ctx.font=`700 ${Math.round(Math.max(18,r*.34))}px ${BODY}`;ctx.letterSpacing='2px';const w=ctx.measureText(b.label).width+22,h=Math.max(28,r*.48);ctx.fillStyle='rgba(28,18,10,.86)';ctx.beginPath();ctx.roundRect(-w/2,r*1.2,w,h,h/2);ctx.fill();
    ctx.fillStyle='#f3e7cf';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.label,0,r*1.2+h/2+1)}
  ctx.restore()}
function ball(b,x,y,r,t){if(b.char&&window.drawChar)return person(b,x,y,r,t);const age=t-b.t0,pop=back(clamp(age/.4));if(pop<=0||b.a<=0)return;r*=pop;ctx.save();ctx.globalAlpha=b.a;ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(0,r*1.02,r*.85,r*.2,0,0,7);ctx.fill();
